name: Regenerate Targeted Resumes (specific IDs)

# Triggered manually after a mass regen ran out of credits and we want to
# re-run only the ones that fell back to static templates.
# Reads the ID list from scripts/regen_targets.json (committed to the repo).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Regenerate targeted resumes
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/regen_targeted.py
      - name: Commit and push regenerated resumes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Save the regenerated PDFs, then on every attempt move HEAD to the
          # latest remote main and re-apply only those PDFs. HEAD must move:
          # `git checkout origin/main -- .` copied files but left HEAD on the
          # starting commit, so any push to main during the run made every
          # retry a non-fast-forward rejection (lost 365 resumes on Oct 11).
          mkdir -p /tmp/regen_pdfs
          { git diff --name-only -- web/resumes/; git ls-files --others --exclude-standard -- web/resumes/; } > /tmp/regen.list
          while IFS= read -r p; do [ -n "$p" ] && cp "$p" /tmp/regen_pdfs/; done < /tmp/regen.list
          echo "Saved $(wc -l < /tmp/regen.list) regenerated PDFs"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            while IFS= read -r p; do [ -n "$p" ] && cp "/tmp/regen_pdfs/$(basename "$p")" "$p"; done < /tmp/regen.list
            git add web/resumes/
            if git diff --cached --quiet; then
              echo "No new resumes to push."
              exit 0
            fi
            COUNT=$(git diff --cached --name-only | wc -l)
            git commit -m "regen: targeted re-tailoring ($COUNT PDFs)"
            if git push; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push rejected, retrying"
            sleep 10
          done
          echo "ERROR: push failed after 5 attempts"
          exit 1
